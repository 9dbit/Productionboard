name: Build Production Assets

on:
  push:
    branches:
      - agent/mvp-production-board
    paths:
      - scripts/build_individual_media.py
      - .github/workflows/build-production-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate individual cover, characters and storyboards
        run: python scripts/build_individual_media.py

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/production-assets/individual
          if git diff --cached --quiet; then
            echo "No generated media changes"
          else
            git commit -m "chore: generate individual production media [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
