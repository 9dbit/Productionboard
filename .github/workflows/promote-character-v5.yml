name: Promote V5 character locks to runtime

on:
  push:
    branches:
      - agent/mvp-production-board
    paths:
      - .github/workflows/promote-character-v5.yml
      - public/production-assets/v5/characters/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-production-board

      - name: Install WebP tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y webp

      - name: Validate all V5 character locks
        run: |
          set -euo pipefail
          for src in arga sari harun bowo dimas penumpang-tanpa-wajah; do
            MANIFEST="public/production-assets/v5/characters/$src/manifest.json"
            test -f "$MANIFEST"
            grep -q '"status": "LOCKED"' "$MANIFEST"
            grep -q '"width": 1200' "$MANIFEST"
            grep -q '"height": 1600' "$MANIFEST"
            test "$(find "public/production-assets/v5/characters/$src" -maxdepth 1 -name '*.png' | wc -l)" -eq 6
          done

      - name: Promote approved PNG locks to stable WebP runtime paths
        run: |
          set -euo pipefail
          promote_character() {
            SRC="$1"
            DEST="$2"
            SRC_DIR="public/production-assets/v5/characters/$SRC"
            DEST_DIR="public/production-assets/individual/characters/$DEST"
            mkdir -p "$DEST_DIR"
            for name in front back left-profile right-profile three-quarter-left three-quarter-right; do
              cwebp -quiet -q 95 -m 6 "$SRC_DIR/$name.png" -o "$DEST_DIR/$name.webp"
            done
          }

          promote_character arga arga
          promote_character sari sari
          promote_character harun pak-harun
          promote_character bowo bowo
          promote_character dimas dimas
          promote_character penumpang-tanpa-wajah penumpang-tanpa-wajah

      - name: Validate runtime files
        run: |
          set -euo pipefail
          for dest in arga sari pak-harun bowo dimas penumpang-tanpa-wajah; do
            DIR="public/production-assets/individual/characters/$dest"
            test "$(find "$DIR" -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
            for f in "$DIR"/*.webp; do
              webpinfo "$f" | grep -q 'Canvas size: 1200 x 1600'
            done
          done

      - name: Commit promoted runtime media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/production-assets/individual/characters
          if git diff --cached --quiet; then
            echo "No runtime media changes to commit"
            exit 0
          fi
          git commit -m "feat(media-v5): promote locked character media to runtime paths"
          git push origin HEAD:agent/mvp-production-board
