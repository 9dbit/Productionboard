name: Import Sari V5 media

on:
  push:
    branches:
      - agent/mvp-production-board
    paths:
      - .github/workflows/import-sari-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sari:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-production-board

      - name: Install image tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

      - name: Download Sari V5 masters
        run: |
          set -euo pipefail
          DEST="public/production-assets/v5/characters/sari"
          mkdir -p "$DEST"
          curl --fail --location --retry 3 'https://at.adobe.com/RH5Utm6XprXIBkKw' -o "$DEST/front.png"
          curl --fail --location --retry 3 'https://at.adobe.com/d3bEx5RC4mcvlOUl' -o "$DEST/three-quarter-right.png"
          curl --fail --location --retry 3 'https://at.adobe.com/0ywATzKf7fG93MQY' -o "$DEST/right-profile.png"
          curl --fail --location --retry 3 'https://at.adobe.com/2lV0A7sgqWIumBpp' -o "$DEST/back.png"
          curl --fail --location --retry 3 'https://at.adobe.com/fXuXzyvHGfB7cLUC' -o "$DEST/three-quarter-left.png"
          curl --fail --location --retry 3 'https://at.adobe.com/SM6azTE2XVcSryaz' -o "$DEST/left-profile.png"

      - name: Normalize to exact 3:4 portrait
        run: |
          set -euo pipefail
          DEST="public/production-assets/v5/characters/sari"
          for f in "$DEST"/*.png; do
            convert "$f" -auto-orient -gravity center -resize '1200x1600^' -extent 1200x1600 PNG24:"$f.tmp.png"
            mv "$f.tmp.png" "$f"
            test "$(identify -format '%wx%h' "$f")" = "1200x1600"
          done

      - name: Write locked manifest
        run: |
          cat > public/production-assets/v5/characters/sari/manifest.json <<'JSON'
          {
            "schemaVersion": 1,
            "characterId": "sari",
            "characterName": "Sari",
            "version": "v5",
            "status": "LOCKED",
            "format": "PNG",
            "width": 1200,
            "height": 1600,
            "aspectRatio": "3:4",
            "identityMaster": "front.png",
            "angles": [
              {"id":"front","file":"front.png"},
              {"id":"three-quarter-right","file":"three-quarter-right.png"},
              {"id":"right-profile","file":"right-profile.png"},
              {"id":"back","file":"back.png"},
              {"id":"three-quarter-left","file":"three-quarter-left.png"},
              {"id":"left-profile","file":"left-profile.png"}
            ]
          }
          JSON

      - name: Validate Sari package
        run: |
          set -euo pipefail
          DEST="public/production-assets/v5/characters/sari"
          test "$(find "$DEST" -maxdepth 1 -name '*.png' | wc -l)" -eq 6
          grep -q '"status": "LOCKED"' "$DEST/manifest.json"
          identify "$DEST"/*.png

      - name: Commit Sari package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/production-assets/v5/characters/sari
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git commit -m "feat(media-v5): lock Sari 6-angle 3x4 character package"
          git push origin HEAD:agent/mvp-production-board
